# reem.bi SSO — login.reembir.com
# Full setup guide: README.md (in this folder)
name = "reem-sso"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
# Keep variables/secrets set in the Cloudflare dashboard when deploying.
keep_vars = true
routes = [
  { pattern = "login.reembir.com", custom_domain = true },
  { pattern = "pay.reembir.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
# Every request goes through the worker first (it serves pay.reembir.com/r/<id> and falls back to these files).
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "reem-sso"
# Paste the id printed by `npx wrangler d1 create reem-sso`
database_id = "eaf16f1b-a732-47fc-b1a1-338d438760fd"

# The support chat (chat.reembir.com) — payment updates go straight to it.
[[services]]
binding = "CHAT"
service = "reem-chat"

[vars]
MAIL_FROM = "reem.bi <no-reply@reembir.com>"

# Set these in the Cloudflare dashboard (Worker → Settings → Variables and Secrets),
# or with `npx wrangler secret put <NAME>`. Never commit them:
#   ADMIN_EMAILS              comma-separated emails that become admins after signing in
#   GOOGLE_CLIENT_ID          OAuth Client ID from Google Cloud Console
#   RESEND_API_KEY            from resend.com, used to send the emails
#   FIREBASE_SERVICE_ACCOUNT  (optional) service-account JSON for sites that use Firebase (NeverLost)
#   PAYPAL_CLIENT_ID          PayPal REST app "Client ID" (payment requests)
#   PAYPAL_CLIENT_SECRET      PayPal REST app "Secret"
#   PAYPAL_ENV                (optional) "sandbox" for testing; live by default
#   CHAT_SERVICE_KEY          (optional) shared secret with chat.reembir.com (its SSO_SERVICE_KEY) —
#                             lets support agents send payment requests and upgrade plans from the chat
#   CHAT_URL                  (optional) defaults to https://chat.reembir.com
