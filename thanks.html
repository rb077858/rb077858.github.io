<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תודה! | reem.bi</title>
<meta name="theme-color" content="#02120a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23020c07'/%3E%3Ctext x='50' y='68' font-size='58' font-family='monospace' font-weight='bold' fill='%2300ff88' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#04120a;
    --green:#00ff88;
    --green-soft:#7dffc4;
    --text:#d9ffe9;
    --muted:#8fb8a4;
    --panel-border:rgba(0,255,136,0.28);
  }
  *{box-sizing:border-box;}
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Courier New', Courier, monospace;
    margin: 0;
    min-height: 100svh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2rem 1.25rem;
  }
  .content {
    max-width: 480px;
    width: 100%;
  }
  .check{
    font-size: clamp(2.5rem, 10vw, 3.5rem);
    line-height: 1;
    margin-bottom: .75rem;
  }
  h1 {
    font-size: clamp(1.8rem, 7vw, 2.5em);
    line-height: 1.2em;
    color: var(--green);
    text-shadow: 0 0 14px rgba(0,255,136,.35);
    word-break: break-word;
  }
  .typing {
    border-right: .15em solid var(--green);
    white-space: nowrap;
    overflow: hidden;
    display: inline-block;
    max-width: 100%;
  }
  p {
    font-size: clamp(1rem, 4vw, 1.2em);
    color: var(--muted);
    margin-top: 20px;
    line-height: 1.6;
  }
  .back-link {
    display: inline-block;
    margin-top: 1.75rem;
    padding: .7rem 1.5rem;
    border: 1px solid var(--green);
    border-radius: 8px;
    color: var(--green);
    text-decoration: none;
    font-size: 1rem;
    transition: background-color .2s, color .2s, transform .2s;
  }
  .back-link:hover {
    background-color: var(--green);
    color: #02120a;
    transform: translateY(-2px);
  }
  @media (prefers-reduced-motion: reduce){
    .typing{border-right:none;white-space:normal;}
  }
</style>
</head>
<body>
<div class="content">
  <div class="check" aria-hidden="true">✅</div>
  <h1><span class="typing" id="typed"></span></h1>
  <p>תודה על שליחת הטופס!<br>
  נחזור אליכם בהקדם האפשרי.</p>
  <a class="back-link" href="/">חזרה לדף הבית</a>
</div>

<script>
  const text = "THANKS!";
  const typedEl = document.getElementById("typed");
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (prefersReducedMotion) {
    typedEl.textContent = text;
  } else {
    let i = 0;
    const speed = 150;
    (function typeWriter() {
      if (i < text.length) {
        typedEl.textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
      }
    })();
  }
</script>
</body>
</html>
